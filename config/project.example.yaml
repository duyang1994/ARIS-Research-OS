project:
  id: PROJECT-001
  name: Example Research Project
  root: D:\Research\Example
  design_document: RESEARCH_PLAN.md
  design_version: v0.1

execution:
  mode: multi_thread_constrained
  allow_parallel: true
  preserve_failed_iterations: true
  require_git: true
  living_manuscript: true

major_redesign_fields:
  - cohort
  - analysis_unit
  - index_anchor
  - observation_window
  - feature_space
  - primary_endpoint
  - external_validation_strategy

human_review_required:
  - scientific_definition_change
  - materially_different_results
  - primary_endpoint_change
  - cohort_redefinition
  - major_redesign
  - external_validation_change
  - claim_promotion_to_primary

writer_policy:
  allowed_result_status:
    - APPROVED
    - FROZEN
  reject_stale_dependencies: true
  maintain_living_manuscript: true

review_policy:
  auto_check_stale_claims: true
  auto_check_figure_lineage: true
  auto_check_result_supersession: true
